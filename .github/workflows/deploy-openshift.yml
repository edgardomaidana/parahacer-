name: CI/CD a Red Hat OpenShift

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar JDK de Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: 3. Compilar y empaquetar con Maven
      run: ./mvnw clean package -DskipTests

    - name: 4. Instalar OpenShift CLI (oc)
      uses: redhat-actions/openshift-tools-installer@v1
      with:
        oc: "latest"

    - name: 5. Autenticarse en el clúster de OpenShift
      uses: redhat-actions/oc-login@v1
      with:
        openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
        openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
        insecure_skip_tls_verify: true

	- name: 6. Enviar el binario JAR y construir la imagen en OpenShift
	  run: |
        # 1. Asegurar que estamos en el proyecto correcto
		oc project ${{ secrets.OPENSHIFT_NAMESPACE }}
		  
		# 2. Crear la configuración de construcción binaria (si no existe)
		oc new-build --name=spring-petclinic --image-stream=java:openjdk-17-ubi8 --binary=true || true
		  
		# 3. Subir el archivo JAR compilado por GitHub para que OpenShift ensamble la imagen
		oc start-build spring-petclinic --from-file=target/spring-petclinic-*.jar --follow
		  
		# 4. Crear la aplicación (Deployment y Service) basados en la imagen que acabamos de construir
		# El "|| true" evita que falle si ya la habías creado antes
		oc new-app --image-stream=spring-petclinic:latest --name=spring-petclinic || true
